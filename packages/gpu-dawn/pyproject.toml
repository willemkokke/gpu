[project]
name = "gpu-dawn"
version = "0.0.0"
description = "Dawn WebGPU bindings for Python"
readme = "README.md"
license = "MIT"
authors = [{ name = "Willem Kokke", email = "mail@willem.net" }]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/gpu"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
BUILD_SHARED_LIBS = "OFF"

[tool.cibuildwheel]
# Build for Python 3.10-3.14 on native platforms, including free-threaded (3.13t, 3.14t)
build = "cp310-* cp311-* cp312-* cp313-* cp313t-* cp314-* cp314t-*"

# Skip 32-bit builds, musllinux, and Python 3.10 on Windows ARM64 (not available)
skip = "*-win32 *-manylinux_i686 *-musllinux_* cp310-win_arm64"

# Enable free-threaded builds (3.13t, 3.14t)
enable = ["cpython-freethreading"]

# Use uv as the build frontend for faster builds
build-frontend = "build[uv]"

# Test the built wheels
test-requires = "pytest"
test-command = "pytest {package}/tests -v"

[tool.cibuildwheel.linux]
# Build for x86_64 and aarch64 (aarch64 via QEMU in CI)
archs = ["x86_64", "aarch64"]

# manylinux_2_28 = glibc 2.28+ (RHEL 8, Ubuntu 20.04+, Debian 10+)
# Good balance of compatibility and modern toolchain (GCC 8+, C++17)
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

# macOS 10.14+ required for C++17 aligned allocation (used by nanobind)
# arm64 requires macOS 11.0+ anyway
environment = { MACOSX_DEPLOYMENT_TARGET = "10.14" }

[tool.cibuildwheel.windows]
archs = ["AMD64", "ARM64"]

[tool.cibuildwheel.pyodide]
# IMPORTANT: Build cp313 BEFORE cp312 (use CIBW_BUILD="cp313-*" then "cp312-*")
# cp313/Pyodide 0.29.x can generate stubs; cp312/Pyodide 0.27.x cannot due to
# filesystem isolation. cp312 reuses the stub that cp313 generates.
build = "cp313-* cp312-*"

# Use python -m pytest instead of pytest - script shims are broken in Pyodide venvs
# See: https://github.com/pyodide/pyodide/issues/4802
test-command = "python -m pytest {package}/tests -v"

# Workaround: scikit-build-core <0.11.7 on macOS produces wrong platform tag
# (macosx instead of emscripten). Fix by retagging the wheel after build.
# See: https://github.com/scikit-build/scikit-build-core/issues/920
# TODO: Remove these overrides when scikit-build-core>=0.11.7 is released

# cp312 uses Pyodide 0.27.x which bundles emsdk 3.1.58
[[tool.cibuildwheel.overrides]]
select = "cp312-pyodide*"
repair-wheel-command = [
    "python -m wheel tags --remove --platform-tag emscripten_3_1_58_wasm32 {wheel}",
    "python {package}/scripts/inject_stub.py $(dirname {wheel})/*emscripten*.whl",
    "mv $(dirname {wheel})/*emscripten*.whl {dest_dir}/",
]

# cp313 uses Pyodide 0.29.x which bundles emsdk 4.0.9
[[tool.cibuildwheel.overrides]]
select = "cp313-pyodide*"
repair-wheel-command = [
    "python -m wheel tags --remove --platform-tag emscripten_4_0_9_wasm32 {wheel}",
    "python {package}/scripts/inject_stub.py $(dirname {wheel})/*emscripten*.whl",
    "mv $(dirname {wheel})/*emscripten*.whl {dest_dir}/",
]
